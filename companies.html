<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Company Directory | WorkWave Portal</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Top Navigation Bar -->
  <header class="navbar">
    <div class="container">
      <a href="index.html" class="brand-logo">
        <div class="brand-icon">W</div>
        <span>Work<strong>Wave</strong></span>
      </a>

      <nav class="nav-menu">
        <a href="index.html" class="nav-link">Home</a>
        <a href="jobs.html" class="nav-link">Job Listings</a>
        <a href="companies.html" class="nav-link">Companies</a>
        <a href="post-job.html" class="nav-link">Post a Job</a>
        <a href="profile.html" class="nav-link">Candidate Profile</a>
      </nav>

      <div class="nav-actions">
        <a href="profile.html" class="saved-jobs-badge-btn" title="View Saved Jobs">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
            <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path>
          </svg>
          <span>Saved</span>
          <span class="badge-count">0</span>
        </a>
        <a href="post-job.html" class="btn btn-primary btn-sm">+ Post a Job</a>
        <button class="nav-toggle-btn" aria-label="Toggle navigation">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <!-- Banner -->
  <section style="background: linear-gradient(180deg, #eff6ff 0%, #f8fafc 100%); padding: 3.5rem 0 2.5rem; border-bottom: 1px solid var(--border-color); text-align: center;">
    <div class="container">
      <h1 style="font-size: 2.35rem; font-weight: 800; color: var(--secondary); margin-bottom: 0.5rem;">Explore Top Hiring Tech Companies</h1>
      <p style="color: var(--text-muted); font-size: 1.05rem; max-width: 600px; margin: 0 auto 2rem;">
        Learn about workplace cultures, tech stacks, and active open engineering positions.
      </p>

      <!-- Filter / Search Row -->
      <div style="max-width: 720px; margin: 0 auto; display: flex; gap: 0.75rem; flex-wrap: wrap;">
        <div class="input-group" style="flex: 1; background: #fff; border: 1px solid var(--border-color);">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input type="text" id="company-search-input" placeholder="Search companies by name or keyword...">
        </div>

        <select id="company-industry-filter" class="form-control" style="width: auto; min-width: 200px; background: #fff;">
          <option value="">All Industries</option>
        </select>
      </div>
    </div>
  </section>

  <!-- Companies Grid Section -->
  <main class="main-content">
    <div class="container">
      <div id="companies-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 1.5rem;">
        <!-- Injected by js/companies.js -->
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <div class="footer-bottom" style="border: none; padding-top: 0;">
        <p>&copy; 2026 WorkWave Portal. MSE 2 Practical Project 19.</p>
        <p><a href="jobs.html" style="color: #60a5fa;">Browse all active vacancies &rarr;</a></p>
      </div>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
  <script src="js/companies.js"></script>
</body>
</html>
